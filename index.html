<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint.Cocho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="./theme.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            font-family: var(--font-body);
            background: #f5f0e8;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .logo {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1a1a1a;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
        }

        nav a {
            color: #1a1a1a;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 0.6;
        }

        main {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .projects-area {
            position: absolute;
            inset: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out);
        }

        .projects-area.is-hidden {
            opacity: 0;
            transform: translateX(-3rem);
            pointer-events: none;
        }

        .home-intro {
            flex: none;
            padding: 2rem 2rem 1.5rem;
            max-width: 40rem;
            font-size: 1.25rem;
            line-height: 1.5;
            color: #1a1a1a;
        }

        .project-block {
            flex: 1;
            min-height: 0;
            cursor: pointer;
            text-decoration: none;
            color: #1a1a1a;
            background: #f5f0e8;
            border-bottom: 1px solid #e0e0e0;
            overflow: hidden;
            display: flex;
            align-items: center;
            position: relative;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        .project-title {
            font-family: var(--font-heading);
            font-weight: var(--font-weight-heading);
            font-size: clamp(2.25rem, 1.1rem + 5.75vw, 10rem);
            line-height: 1.05;
            padding: 0 2rem;
        }

        .project-block.green:hover {
            background: #52C41A;
        }

        .project-block.yellow:hover {
            background: #FADB14;
        }

        .project-block.purple:hover {
            background: #6366f1;
            color: #ffffff;
        }

        .project-view {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: translateY(2rem);
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out), visibility 0s linear 0.5s;
        }

        .project-view.active {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
            pointer-events: auto;
            transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out), visibility 0s;
        }

        .project-view iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0;
            transition: opacity 0.4s ease 0.15s;
        }

        .project-view iframe.is-loaded {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .projects-area,
            .project-view,
            .project-view iframe {
                transition: none;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }

            nav {
                gap: 1rem;
                font-size: 0.8rem;
            }

            .logo {
                font-size: 0.85rem;
            }

        }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo" onclick="showHome(event)">Saint.Cocho</a>
        <nav>
            <a href="#" onclick="showHome(event)">Work</a>
            <a href="https://substack.com/@saintcocho" target="_blank">Essays</a>
        </nav>
    </header>

    <main>
        <div class="projects-area" id="home">
            <p class="home-intro">hola, este es mi espacio donde escribo y hago cosas porque me da la gana, ya saben, diseñar y perder el tiempo</p>
            <a class="project-block green" onclick="openProject('narrativas', event)">
                <div class="project-title">Narrativas Futboleros</div>
            </a>
            <a class="project-block purple" onclick="openProject('sancocho', event)">
                <div class="project-title">Sancocho Vallenato</div>
            </a>
        </div>

        <div class="project-view" id="projectView"></div>
    </main>

    <script>
        const projects = {
            narrativas: './narrativas-futboleros/index.html',
            sancocho: './sancocho-vallenato/index.html'
        };

        function openProject(projectId, event) {
            event.preventDefault();
            const url = projects[projectId];
            if (!url) return;

            const view = document.getElementById('projectView');
            view.innerHTML = `<iframe src="${url}" allow="popup"></iframe>`;
            view.querySelector('iframe').addEventListener('load', (e) => e.target.classList.add('is-loaded'));
            document.getElementById('home').classList.add('is-hidden');
            view.classList.add('active');
        }

        function showHome(event) {
            event.preventDefault();
            const view = document.getElementById('projectView');
            view.classList.remove('active');
            document.getElementById('home').classList.remove('is-hidden');
            setTimeout(() => {
                if (!view.classList.contains('active')) view.innerHTML = '';
            }, 500);
        }
    </script>
</body>
</html>
