<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint.Cocho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            --mobile-scale: 1.3;
            --mobile-padding-offset: 0.6;
        }

        body {
            background-color: #ffffff;
            color: rgba(0, 0, 0, 0.85);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            padding: 1rem;
        }

        a {
            color: rgba(0, 0, 0, 0.85);
            text-decoration: none;
        }

        a:hover {
            opacity: 0.7;
        }

        a:active {
            opacity: 0.7;
        }

        h1 {
            font-family: 'Courier New', monospace;
            font-style: normal;
            font-weight: 400;
            margin: 0;
            font-size: 4.5rem;
            line-height: 1.2;
            color: rgba(0, 0, 0, 0.85);
            letter-spacing: -0.015em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.65rem;
            }
        }

        ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
        }

        ul.lineated {
            margin: 0;
            padding: 0;
            list-style-type: none;
            margin: 0 0 0 3em;
            text-indent: -3em;
        }

        li {
            line-height: 1.2;
            margin-bottom: 0.5em;
        }

        li a {
            display: inline;
        }

        .page-content {
            padding: 1rem;
            text-align: left;
            background-color: #ffffff;
            border-width: 0.1rem;
            border-color: rgba(0, 0, 0, 0.1);
            border-style: solid;
            max-width: 100%;
        }

        .footer {
            margin-top: 2rem;
            padding: 1rem;
            color: rgba(0, 0, 0, 0.4);
            font-size: 0.9rem;
            border-top: 0.1rem solid rgba(0, 0, 0, 0.1);
        }

        .footer a {
            color: rgba(0, 0, 0, 0.4);
        }

        .footer a:hover {
            color: rgba(0, 0, 0, 0.85);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 1rem;
            border-bottom: 0.1rem solid rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 400;
            margin: 0;
        }

        .header-nav {
            display: flex;
            gap: 2rem;
            font-size: 0.95rem;
        }

        .header-nav a {
            color: rgba(0, 0, 0, 0.85);
            text-decoration: none;
        }

        .header-nav a:hover {
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
            }

            .header-nav {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">Saint.Cocho</div>
        <div class="header-nav">
            <a href="#projects">Projects</a>
            <a href="#info">Info</a>
            <a href="#blog">Blog</a>
        </div>
    </div>

    <div class="page-content">
        <h1>
            <ul class="lineated">
                <li><a href="#home">Saint.Cocho</a></li>
                <li><a href="./narrativas-futboleros/">Narrativas Futboleros</a></li>
                <li><a href="#">Proyecto 2</a></li>
                <li><a href="#">Proyecto 3</a></li>
            </ul>
        </h1>
    </div>

    <div class="footer">
        <a href="#">Last Updated: 2026-10-05</a>
    </div>
</body>
</html>
