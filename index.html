<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint.Cocho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-font: 'Georgia', serif;
            --secondary-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            background: #ffffff;
            color: #1a1a1a;
            font-family: var(--secondary-font);
            display: flex;
            overflow: hidden;
        }

        /* LEFT PANEL */
        .left-panel {
            width: 50%;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-family: var(--primary-font);
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .tagline {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 3rem;
            font-weight: 400;
        }

        nav {
            margin-bottom: 4rem;
            display: flex;
            gap: 2.5rem;
        }

        nav a {
            font-size: 0.9rem;
            color: #1a1a1a;
            text-decoration: none;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #666;
        }

        .projects-section {
            flex: 1;
        }

        .project {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .project:last-child {
            border-bottom: none;
        }

        .project:hover {
            opacity: 0.6;
        }

        .project-number {
            font-size: 0.85rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .project-title {
            font-family: var(--primary-font);
            font-size: 1.6rem;
            font-weight: 400;
            color: #1a1a1a;
            line-height: 1.3;
        }

        .project.active .project-title {
            font-weight: 600;
        }

        /* RIGHT PANEL */
        .right-panel {
            width: 50%;
            background: #fafafa;
            padding: 4rem 3rem;
            overflow-y: auto;
            display: none;
            flex-direction: column;
        }

        .right-panel.active {
            display: flex;
        }

        .panel-header {
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .panel-title {
            font-family: var(--primary-font);
            font-size: 2.2rem;
            font-weight: 400;
            color: #1a1a1a;
        }

        .close-btn {
            font-size: 1.8rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #1a1a1a;
        }

        .panel-content {
            flex: 1;
        }

        .panel-content p {
            font-size: 1rem;
            line-height: 1.8;
            color: #555;
            margin-bottom: 1.5rem;
        }

        .panel-section {
            margin-bottom: 2.5rem;
        }

        .panel-section h3 {
            font-family: var(--primary-font);
            font-size: 1.1rem;
            font-weight: 400;
            color: #1a1a1a;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .panel-section ul {
            list-style: none;
            padding-left: 0;
        }

        .panel-section li {
            color: #666;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .cta-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        .cta-link:hover {
            background: #333;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .left-panel {
                width: 100%;
                padding: 2rem;
            }

            .right-panel {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                z-index: 100;
                border-right: none;
            }

            .logo {
                font-size: 2rem;
            }

            .project-title {
                font-size: 1.3rem;
            }

            .panel-title {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 768px) {
            .left-panel {
                padding: 1.5rem;
            }

            .right-panel {
                padding: 1.5rem;
            }

            nav {
                gap: 1rem;
            }

            .logo {
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }

            .tagline {
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- LEFT PANEL -->
    <div class="left-panel">
        <div class="logo">Saint.Cocho</div>
        <div class="tagline">portfolio + essays</div>

        <nav>
            <a href="#info">Info</a>
            <a href="#blog">Essays</a>
        </nav>

        <div class="projects-section" id="projectsList"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel" id="rightPanel">
        <div class="panel-header">
            <div class="panel-title" id="panelTitle"></div>
            <button class="close-btn" onclick="closePanel()">✕</button>
        </div>
        <div class="panel-content" id="panelContent"></div>
    </div>

    <script>
        const projects = [
            {
                id: 'narrativas',
                number: '01',
                title: 'Narrativas Futboleros',
                description: 'A scrollytelling experience about Colombian football culture, teams, and the beautiful game\'s place in our hearts.',
                type: 'Interactive Narrative',
                tech: ['HTML5', 'CSS3', 'JavaScript', 'SVG'],
                year: '2026',
                url: './narrativas-futboleros/'
            },
            {
                id: 'proyecto2',
                number: '02',
                title: 'Proyecto 2',
                description: 'Coming soon. Exploring new narratives and interactive experiences.',
                type: 'To be announced',
                tech: ['TBA'],
                year: '2026',
                url: '#'
            },
            {
                id: 'proyecto3',
                number: '03',
                title: 'Proyecto 3',
                description: 'Coming soon. More stories to tell.',
                type: 'To be announced',
                tech: ['TBA'],
                year: '2026',
                url: '#'
            }
        ];

        function renderProjects() {
            const projectsList = document.getElementById('projectsList');
            projectsList.innerHTML = projects.map(p => `
                <div class="project" onclick="openProject('${p.id}')">
                    <div class="project-number">${p.number}</div>
                    <div class="project-title">${p.title}</div>
                </div>
            `).join('');
        }

        function openProject(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            // Update right panel
            document.getElementById('panelTitle').textContent = project.title;
            document.getElementById('panelContent').innerHTML = `
                <p>${project.description}</p>
                <div class="panel-section">
                    <h3>Project Type</h3>
                    <p>${project.type}</p>
                </div>
                <div class="panel-section">
                    <h3>Technologies</h3>
                    <ul>${project.tech.map(t => `<li>${t}</li>`).join('')}</ul>
                </div>
                <div class="panel-section">
                    <h3>Year</h3>
                    <p>${project.year}</p>
                </div>
                <a href="${project.url}" target="_blank" class="cta-link">View Project</a>
            `;

            // Show right panel
            document.getElementById('rightPanel').classList.add('active');

            // Update active state
            document.querySelectorAll('.project').forEach(el => {
                el.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        function closePanel() {
            document.getElementById('rightPanel').classList.remove('active');
            document.querySelectorAll('.project').forEach(el => {
                el.classList.remove('active');
            });
        }

        // Initialize
        renderProjects();
    </script>
</body>
</html>
