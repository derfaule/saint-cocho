<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint.Cocho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            background: #ffffff;
            color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            display: flex;
            overflow: hidden;
        }

        /* LEFT PANEL */
        .left-panel {
            width: 50%;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .tagline {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 3rem;
            font-weight: 400;
        }

        nav {
            margin-bottom: 4rem;
            display: flex;
            gap: 2.5rem;
        }

        nav a {
            font-size: 0.9rem;
            color: #1a1a1a;
            text-decoration: none;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #666;
        }

        .projects-section {
            flex: 1;
        }

        .project {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .project:last-child {
            border-bottom: none;
        }

        .project:hover {
            opacity: 0.6;
        }

        .project-number {
            font-size: 0.85rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .project-title {
            font-size: 1.6rem;
            font-weight: 400;
            color: #1a1a1a;
            line-height: 1.3;
        }

        .project.active .project-title {
            font-weight: 600;
        }

        /* RIGHT PANEL */
        .right-panel {
            width: 50%;
            background: #fafafa;
            overflow: hidden;
            display: none;
            flex-direction: column;
        }

        .right-panel.active {
            display: flex;
        }

        .panel-header {
            padding: 2rem 3rem;
            border-bottom: 1px solid #e0e0e0;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 2.2rem;
            font-weight: 400;
            color: #1a1a1a;
        }

        .close-btn {
            font-size: 1.8rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #1a1a1a;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
        }

        .project-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .left-panel {
                width: 100%;
                padding: 2rem;
            }

            .right-panel {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                z-index: 100;
            }

            .logo {
                font-size: 2rem;
            }

            .project-title {
                font-size: 1.3rem;
            }

            .panel-title {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 768px) {
            .left-panel {
                padding: 1.5rem;
            }

            nav {
                gap: 1rem;
            }

            .logo {
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }

            .tagline {
                margin-bottom: 1.5rem;
            }

            .panel-header {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- LEFT PANEL -->
    <div class="left-panel">
        <div class="logo">Saint.Cocho</div>
        <div class="tagline">portfolio + essays</div>

        <nav>
            <a href="#info">Info</a>
            <a href="#blog">Essays</a>
        </nav>

        <div class="projects-section" id="projectsList"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel" id="rightPanel">
        <div class="panel-header">
            <div class="panel-title" id="panelTitle"></div>
            <button class="close-btn" onclick="closePanel()">✕</button>
        </div>
        <div class="panel-content" id="panelContent"></div>
    </div>

    <script>
        const projects = [
            {
                id: 'narrativas',
                number: '01',
                title: 'Narrativas Futboleros',
                url: './narrativas-futboleros/'
            },
            {
                id: 'proyecto2',
                number: '02',
                title: 'Proyecto 2',
                url: null
            },
            {
                id: 'proyecto3',
                number: '03',
                title: 'Proyecto 3',
                url: null
            }
        ];

        function renderProjects() {
            const projectsList = document.getElementById('projectsList');
            projectsList.innerHTML = projects.map(p => `
                <div class="project" onclick="openProject('${p.id}')">
                    <div class="project-number">${p.number}</div>
                    <div class="project-title">${p.title}</div>
                </div>
            `).join('');
        }

        function openProject(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project || !project.url) return;

            // Update title
            document.getElementById('panelTitle').textContent = project.title;

            // Load project in iframe
            const panelContent = document.getElementById('panelContent');
            panelContent.innerHTML = `<iframe src="${project.url}" class="project-iframe"></iframe>`;

            // Show right panel
            document.getElementById('rightPanel').classList.add('active');

            // Update active state
            document.querySelectorAll('.project').forEach(el => {
                el.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        function closePanel() {
            document.getElementById('rightPanel').classList.remove('active');
            document.getElementById('panelContent').innerHTML = '';
            document.querySelectorAll('.project').forEach(el => {
                el.classList.remove('active');
            });
        }

        // Initialize
        renderProjects();
    </script>
</body>
</html>
