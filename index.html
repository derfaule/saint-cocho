<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint.Cocho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="./theme.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --home-display-size: clamp(1.9rem, 0.95rem + 3.9vw, 8.5rem);
            --page-gutter: 2rem;
            font-family: var(--font-body);
            background: var(--color-bg);
            color: var(--color-fg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            font-family: var(--font-heading);
            font-weight: var(--font-weight-heading);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem var(--page-gutter);
            background: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
        }

        .logo {
            font-size: 0.95rem;
            color: var(--color-fg);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
        }

        nav a {
            color: var(--color-fg);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 0.6;
        }

        main {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .projects-area {
            position: absolute;
            inset: 0;
            overflow-x: hidden;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: start;
            transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out);
        }

        .home-projects {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .projects-area.is-hidden {
            opacity: 0;
            transform: translateX(-3rem);
            pointer-events: none;
        }

        .home-intro {
            font-family: var(--font-heading);
            padding: 2rem var(--page-gutter) 1.5rem;
            font-size: var(--home-display-size);
            line-height: 1.05;
            color: var(--color-fg);
        }

        .project-block {
            cursor: pointer;
            text-decoration: none;
            color: var(--color-fg);
            background: var(--color-bg);
            position: relative;
            padding: 1.5rem var(--page-gutter);
        }

        .project-title {
            display: inline;
            font-family: var(--font-heading);
            font-weight: var(--font-weight-heading);
            font-size: var(--home-display-size);
            line-height: 1.15;
            overflow-wrap: break-word;
            background-image: linear-gradient(currentColor, currentColor);
            background-repeat: no-repeat;
            background-position: 0 100%;
            background-size: 0% 0.06em;
            transition: background-size 0.2s ease-out;
        }

        .project-desc {
            font-family: var(--font-heading);
            font-size: clamp(0.95rem, 0.8rem + 0.6vw, 1.35rem);
            line-height: 1.5;
            opacity: 0.75;
            max-width: 30rem;
            margin-top: 0.75rem;
        }

        .project-block:hover .project-title {
            background-size: 100% 0.06em;
        }

        .project-view {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: translateY(2rem);
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out), visibility 0s linear 0.5s;
        }

        .project-view.active {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
            pointer-events: auto;
            transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out), visibility 0s;
        }

        .project-view iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0;
            transition: opacity 0.4s ease 0.15s;
        }

        .project-view iframe.is-loaded {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .projects-area,
            .project-view,
            .project-view iframe {
                transition: none;
            }
        }

        @media (max-width: 768px) {
            body {
                --page-gutter: 1.25rem;
            }

            .projects-area {
                grid-template-columns: 1fr;
            }

            nav {
                gap: 1rem;
                font-size: 0.8rem;
            }

            .logo {
                font-size: 0.85rem;
            }

        }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo" onclick="showHome(event)">Saint.Cocho</a>
        <nav>
            <a href="#" onclick="showHome(event)">Work</a>
            <a href="https://substack.com/@saintcocho" target="_blank">Essays</a>
        </nav>
    </header>

    <main>
        <div class="projects-area" id="home">
            <p class="home-intro">hola, este es mi espacio donde escribo y hago cosas porque me da la gana, ya saben, diseñar y perder el tiempo.<br>Aquí algunos ejemplos:</p>
            <div class="home-projects">
                <a class="project-block" onclick="openProject('narrativas', event)">
                    <div class="project-title">Narrativas Futboleros</div>
                    <div class="project-desc">Descripción breve del proyecto, por escribir.</div>
                </a>
                <a class="project-block" onclick="openProject('sancocho', event)">
                    <div class="project-title">Sancocho Vallenato</div>
                    <div class="project-desc">Descripción breve del proyecto, por escribir.</div>
                </a>
            </div>
        </div>

        <div class="project-view" id="projectView"></div>
    </main>

    <script>
        const projects = {
            narrativas: './narrativas-futboleros/index.html',
            sancocho: './sancocho-vallenato/index.html'
        };

        function openProject(projectId, event) {
            event.preventDefault();
            const url = projects[projectId];
            if (!url) return;

            const view = document.getElementById('projectView');
            view.innerHTML = `<iframe src="${url}" allow="popup"></iframe>`;
            view.querySelector('iframe').addEventListener('load', (e) => e.target.classList.add('is-loaded'));
            document.getElementById('home').classList.add('is-hidden');
            view.classList.add('active');
        }

        function showHome(event) {
            event.preventDefault();
            const view = document.getElementById('projectView');
            view.classList.remove('active');
            document.getElementById('home').classList.remove('is-hidden');
            setTimeout(() => {
                if (!view.classList.contains('active')) view.innerHTML = '';
            }, 500);
        }
    </script>
</body>
</html>
