<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint.Cocho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: rgba(0, 0, 0, 0.85);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            overflow: hidden;
        }

        a {
            color: rgba(0, 0, 0, 0.85);
            text-decoration: none;
            cursor: pointer;
        }

        a:hover {
            opacity: 0.7;
        }

        a:active {
            opacity: 0.7;
        }

        /* LEFT COLUMN */
        .left-panel {
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .header-nav {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .header-nav a {
            color: rgba(0, 0, 0, 0.85);
        }

        .project-list {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .project-list h1 {
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .project-list ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
        }

        .project-list li {
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .project-list li a {
            cursor: pointer;
            padding: 0.25rem 0;
            display: block;
        }

        .project-list li a:hover {
            opacity: 0.6;
        }

        .project-list li a.active {
            font-weight: 600;
            text-decoration: underline;
        }

        /* RIGHT COLUMN */
        .right-panel {
            background-color: #ffffff;
            border-left: 1px solid rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            padding: 2rem;
            display: none;
        }

        .right-panel.active {
            display: block;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .panel-title {
            font-size: 1.8rem;
            font-weight: 500;
        }

        .close-btn {
            font-size: 1.5rem;
            cursor: pointer;
            color: rgba(0, 0, 0, 0.5);
        }

        .close-btn:hover {
            color: rgba(0, 0, 0, 0.85);
        }

        .panel-content {
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(0, 0, 0, 0.8);
        }

        .panel-content p {
            margin-bottom: 1.5rem;
        }

        .panel-content h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
        }

        .panel-content ul {
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .panel-content li {
            margin-bottom: 0.3rem;
        }

        /* FOOTER */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.75rem 1.5rem;
            font-size: 0.8rem;
            color: rgba(0, 0, 0, 0.4);
            background: #ffffff;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            grid-column: 1 / -1;
            text-align: right;
            z-index: 10;
        }

        .footer a {
            color: rgba(0, 0, 0, 0.4);
        }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            body {
                grid-template-columns: 1fr;
            }

            .right-panel {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                border-left: none;
                z-index: 100;
            }

            .left-panel {
                z-index: 50;
                max-height: calc(100vh - 60px);
            }
        }

        @media (max-width: 768px) {
            body {
                grid-template-columns: 1fr;
            }

            .project-list h1 {
                font-size: 1.8rem;
            }

            .left-panel {
                padding-bottom: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- LEFT PANEL: Navigation & Projects -->
    <div class="left-panel">
        <div class="header">
            <div class="header-title">Saint.Cocho</div>
            <div class="header-nav">
                <a href="#info">Info</a>
                <a href="#blog">Blog</a>
            </div>
        </div>

        <div class="project-list">
            <h1>
                <ul>
                    <li><a class="project-link" data-project="narrativas">Narrativas Futboleros</a></li>
                    <li><a class="project-link" data-project="proyecto2">Proyecto 2</a></li>
                    <li><a class="project-link" data-project="proyecto3">Proyecto 3</a></li>
                </ul>
            </h1>
        </div>
    </div>

    <!-- RIGHT PANEL: Project Details -->
    <div class="right-panel">
        <div class="panel-header">
            <div class="panel-title" id="panelTitle">Select a project</div>
            <div class="close-btn" onclick="closePanel()">✕</div>
        </div>
        <div class="panel-content" id="panelContent">
            <p>Click on a project to view details.</p>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <a href="#">Last Updated: 2026-10-05</a>
    </div>

    <script>
        const projects = {
            narrativas: {
                title: 'Narrativas Futboleros',
                content: `
                    <p>A scrollytelling experience about Colombian football culture, teams, and the beautiful game's place in our hearts.</p>
                    <h3>Project Type</h3>
                    <p>Interactive Narrative / Scrollytelling</p>
                    <h3>Technologies</h3>
                    <ul>
                        <li>HTML5</li>
                        <li>CSS3</li>
                        <li>JavaScript</li>
                        <li>Data Visualization</li>
                    </ul>
                    <h3>Explore</h3>
                    <p><a href="./narrativas-futboleros/" target="_blank">Open Project →</a></p>
                `
            },
            proyecto2: {
                title: 'Proyecto 2',
                content: '<p>Coming soon...</p>'
            },
            proyecto3: {
                title: 'Proyecto 3',
                content: '<p>Coming soon...</p>'
            }
        };

        function openProject(projectKey) {
            const project = projects[projectKey];
            if (project) {
                document.getElementById('panelTitle').textContent = project.title;
                document.getElementById('panelContent').innerHTML = project.content;
                document.querySelector('.right-panel').classList.add('active');

                // Update active state
                document.querySelectorAll('.project-link').forEach(link => {
                    link.classList.remove('active');
                });
                document.querySelector(`[data-project="${projectKey}"]`).classList.add('active');
            }
        }

        function closePanel() {
            document.querySelector('.right-panel').classList.remove('active');
            document.querySelectorAll('.project-link').forEach(link => {
                link.classList.remove('active');
            });
        }

        // Add event listeners
        document.querySelectorAll('.project-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                openProject(link.dataset.project);
            });
        });
    </script>
</body>
</html>
