<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint.Cocho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
        }

        /* HEADER */
        header {
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 2rem;
            font-size: 0.95rem;
        }

        nav a {
            color: #1a1a1a;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.6;
        }

        /* MAIN CONTAINER */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* PROJECT GRID */
        .projects {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .project-block {
            padding: 3rem 2rem;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            color: inherit;
        }

        .project-block:hover {
            transform: translateY(-4px);
            opacity: 0.9;
        }

        .project-title {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        /* COLOR VARIANTS */
        .project-block.green {
            background: #4CAF50;
            color: #1a1a1a;
        }

        .project-block.red {
            background: #E94B3C;
            color: #ffffff;
        }

        .project-block.blue {
            background: #2196F3;
            color: #1a1a1a;
        }

        .project-block.yellow {
            background: #FFEB3B;
            color: #1a1a1a;
        }

        .project-block.teal {
            background: #009688;
            color: #ffffff;
        }

        .project-block.purple {
            background: #9C27B0;
            color: #ffffff;
        }

        .project-block.orange {
            background: #FF9800;
            color: #1a1a1a;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 8px;
            width: 100%;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .close-btn {
            font-size: 2rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #1a1a1a;
        }

        .modal-body {
            padding: 2rem;
        }

        .project-iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 4px;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 0.9rem;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            nav {
                width: 100%;
                justify-content: center;
            }

            .project-title {
                font-size: 1.8rem;
            }

            .project-block {
                min-height: 120px;
                padding: 2rem 1rem;
            }

            .modal-title {
                font-size: 1.8rem;
            }

            .project-iframe {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="logo">Saint.Cocho</div>
        <nav>
            <a href="#info">Info</a>
            <a href="#essays">Essays</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main>
        <section class="projects">
            <a class="project-block green" onclick="openProject('narrativas', event)">
                <div class="project-title">Narrativas Futboleros</div>
            </a>
            <a class="project-block red" onclick="openProject('proyecto2', event)">
                <div class="project-title">Proyecto 2</div>
            </a>
            <a class="project-block blue" onclick="openProject('proyecto3', event)">
                <div class="project-title">Proyecto 3</div>
            </a>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Saint.Cocho — Interactive Narratives</p>
    </footer>

    <!-- MODAL -->
    <div class="modal" id="projectModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle"></div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div id="modalBody"></div>
            </div>
        </div>
    </div>

    <script>
        const projects = {
            narrativas: {
                title: 'Narrativas Futboleros',
                url: './narrativas-futboleros/'
            },
            proyecto2: {
                title: 'Proyecto 2',
                url: null
            },
            proyecto3: {
                title: 'Proyecto 3',
                url: null
            }
        };

        function openProject(projectId, event) {
            event.preventDefault();
            const project = projects[projectId];

            if (!project || !project.url) {
                alert('Coming soon');
                return;
            }

            document.getElementById('modalTitle').textContent = project.title;
            document.getElementById('modalBody').innerHTML = `
                <iframe src="${project.url}" class="project-iframe"></iframe>
            `;
            document.getElementById('projectModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('projectModal').classList.remove('active');
            document.getElementById('modalBody').innerHTML = '';
        }

        // Close modal on ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
