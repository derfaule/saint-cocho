<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint.Cocho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
            z-index: 10;
        }

        .logo {
            font-size: 0.95rem;
            font-weight: 500;
        }

        nav {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
        }

        nav a {
            color: #1a1a1a;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 0.6;
        }

        /* MAIN CONTAINER */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* LEFT SIDE - PROJECTS */
        .projects-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .project-block {
            flex: 1;
            min-height: 200px;
            cursor: pointer;
            transition: opacity 0.2s;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .project-block:hover {
            opacity: 0.9;
        }

        .project-title-scroll {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1.1;
            white-space: nowrap;
            animation: scroll 15s linear infinite;
            padding: 0 2rem;
        }

        @keyframes scroll {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        /* COLOR VARIANTS */
        .project-block.green {
            background: #52C41A;
            color: #1a1a1a;
        }

        .project-block.red {
            background: #FF4D4F;
            color: #ffffff;
        }

        .project-block.blue {
            background: #1890FF;
            color: #ffffff;
        }

        .project-block.yellow {
            background: #FADB14;
            color: #1a1a1a;
        }

        /* RIGHT SIDE - PROJECT VIEW */
        .project-view {
            width: 50%;
            background: #f5f5f5;
            border-left: 1px solid #e0e0e0;
            overflow-y: auto;
            display: none;
            flex-direction: column;
        }

        .project-view.active {
            display: flex;
        }

        .project-view-header {
            padding: 1.5rem;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .project-view-title {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #1a1a1a;
        }

        .project-view-content {
            flex: 1;
            overflow-y: auto;
        }

        .project-view-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 4px;
        }

        /* MOBILE */
        @media (max-width: 1024px) {
            .project-view {
                position: fixed;
                top: 0;
                right: 0;
                width: 100%;
                max-width: 500px;
                height: 100vh;
                z-index: 100;
                border-left: none;
            }

            .project-view.active {
                display: flex;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }

            nav {
                gap: 1rem;
                font-size: 0.8rem;
            }

            .logo {
                font-size: 0.85rem;
            }

            .project-title-scroll {
                font-size: 2.5rem;
            }

            .project-view {
                width: 100%;
                max-width: none;
            }

            .project-view-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="logo">Saint.Cocho</div>
        <nav>
            <a href="#info">Information</a>
            <a href="#essays">Essays</a>
        </nav>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">
        <!-- LEFT: PROJECTS -->
        <div class="projects-area">
            <a class="project-block green" onclick="openProject('narrativas', event)">
                <div class="project-title-scroll">
                    Narrativas Futboleros — Narrativas Futboleros — Narrativas Futboleros — Narrativas Futboleros —
                </div>
            </a>
            <a class="project-block red" onclick="openProject('proyecto2', event)">
                <div class="project-title-scroll">
                    Proyecto 2 — Proyecto 2 — Proyecto 2 — Proyecto 2 — Proyecto 2 — Proyecto 2 —
                </div>
            </a>
            <a class="project-block blue" onclick="openProject('proyecto3', event)">
                <div class="project-title-scroll">
                    Proyecto 3 — Proyecto 3 — Proyecto 3 — Proyecto 3 — Proyecto 3 — Proyecto 3 —
                </div>
            </a>
        </div>

        <!-- RIGHT: PROJECT VIEW -->
        <div class="project-view" id="projectView">
            <div class="project-view-header">
                <div class="project-view-title" id="viewTitle"></div>
                <button class="close-btn" onclick="closeProject()">✕</button>
            </div>
            <div class="project-view-content" id="viewContent"></div>
        </div>
    </div>

    <script>
        const projects = {
            narrativas: {
                title: 'Narrativas Futboleros',
                url: './narrativas-futboleros/index.html'
            },
            proyecto2: {
                title: 'Proyecto 2',
                url: null
            },
            proyecto3: {
                title: 'Proyecto 3',
                url: null
            }
        };

        function openProject(projectId, event) {
            event.preventDefault();
            const project = projects[projectId];

            if (!project || !project.url) {
                alert('Coming soon');
                return;
            }

            document.getElementById('viewTitle').textContent = project.title;
            document.getElementById('viewContent').innerHTML = `<iframe src="${project.url}" style="width: 100%; height: 100%; border: none;"></iframe>`;
            document.getElementById('projectView').classList.add('active');
        }

        function closeProject() {
            document.getElementById('projectView').classList.remove('active');
            document.getElementById('viewContent').innerHTML = '';
        }

        // Close on ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeProject();
            }
        });
    </script>
</body>
</html>
