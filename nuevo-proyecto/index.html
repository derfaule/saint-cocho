<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Proyecto</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/derfaule/saint-cocho-theme@a2c7470cd680a491f2ab71eecc3f6c077ee9d6a5/components/story-grid/story-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/derfaule/saint-cocho-theme@a2c7470cd680a491f2ab71eecc3f6c077ee9d6a5/components/story-grid/story-grid-layout.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sg-wrapper">
        <main class="sg-main">
            <section class="sg-hero">
                <div>
                    <h1>Nuevo Proyecto</h1>
                    <p class="sg-hero-subtitle">Subtítulo del proyecto, por escribir.</p>
                </div>
            </section>

            <section class="sg-intro">
                <div class="sg-panel">
                    <h2 class="sg-title">Introducción</h2>
                    <!-- Optional: delete this block if there is no intro image -->
                    <div class="sg-intro-image">
                        <img src="" alt="" hidden>
                    </div>
                    <div class="sg-intro-text">
                        <p>Texto de introducción, por escribir.</p>
                        <p>Segundo párrafo, por escribir.</p>
                    </div>
                </div>
            </section>

            <section class="sg-stories">
                <div class="sg-panel">
                    <h2 class="sg-title">Historias</h2>
                    <div class="sg-list" id="storiesGrid"></div>
                </div>
            </section>
        </main>

        <footer class="sg-footer">
            <p>&copy; 2026 Nuevo Proyecto.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/derfaule/saint-cocho-theme@a2c7470cd680a491f2ab71eecc3f6c077ee9d6a5/components/story-grid/story-grid.js"></script>
    <script src="script.js"></script>
</body>
</html>
