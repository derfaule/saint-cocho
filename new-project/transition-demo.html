<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo de transición</title>
    <link rel="stylesheet" href="/theme.css">
    <style>
        body {
            background: var(--color-bg);
            color: var(--color-fg);
            font-family: var(--font-body);
            padding: 2rem;
            text-align: center;
        }

        .stage {
            position: relative;
            width: min(560px, 90vw);
            aspect-ratio: 1;
            margin: 2.5rem auto 1.5rem;
            border: 3px double var(--color-fg);
            outline: 1px solid var(--color-fg);
            outline-offset: 6px;
            overflow: hidden;
        }

        .stage img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .stage .next {
            clip-path: inset(0 100% 0 0);
        }

        .stage.swap .next {
            animation: wipe 0.8s steps(8, end) forwards;
        }

        @keyframes wipe {
            to {
                clip-path: inset(0 0 0 0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stage.swap .next {
                animation: none;
                clip-path: inset(0 0 0 0);
            }
        }

        button {
            font: inherit;
            padding: 0.5rem 1.2rem;
            background: var(--color-bg);
            color: var(--color-fg);
            border: 1px solid var(--color-fg);
            cursor: pointer;
        }

        button:hover {
            background: var(--color-fg);
            color: var(--color-bg);
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <img class="current" src="images/481259841_967407658862887_8114938719550194916_n.jpg" alt="">
        <img class="next" src="images/600550530_1190548629882121_8883398668346116081_n.jpg" alt="">
    </div>
    <button id="swap" type="button">Cambiar imagen</button>

    <script>
        document.getElementById('swap').addEventListener('click', () => {
            document.getElementById('stage').classList.toggle('swap');
        });
    </script>
</body>
</html>
